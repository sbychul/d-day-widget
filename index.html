<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>D-day</title>
  </head>
  <body>
    <main class="widget">
      <p class="today" id="today"></p>
      <div class="main empty" id="main"></div>
      <hr class="divider" />
      <ul class="list" id="list"></ul>
      <hr class="divider" />
      <div class="composer">
        <div class="status-row" id="status-row" hidden>
          <p class="status" id="status" aria-live="polite"></p>
          <button type="button" class="cancel" id="cancel" hidden>Cancel</button>
        </div>
        <form class="input" id="form" autocomplete="off">
          <span class="plus" aria-hidden="true">+</span>
          <input id="input" aria-label="Add event" placeholder="12/25 Christmas" enterkeyhint="done" />
        </form>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
